name: Verify Native UI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
      NYADB_DUCKDB_IT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test DuckDB runtime installer
        run: python -m unittest discover -s tests -p test_duckdb_runtime.py -v
      - name: Install verified DuckDB runtime
        run: python tools/install_duckdb_runtime.py
      - name: Verify generated locales
        run: |
          go tool mygo generate
          go tool mygo i18n check
          git diff --exit-code -- locales/catalog_gen.go
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: MyGo UI vet
        run: go tool mygo vet
        env:
          CGO_ENABLED: "0"
      - name: Build
        run: go build ./cmd/nyadb
        env:
          CGO_ENABLED: "0"
